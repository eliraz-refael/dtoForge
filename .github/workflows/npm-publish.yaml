name: Publish to NPM

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.1.0)'
        required: true
        type: string
      release_tag:
        description: 'GitHub release tag (e.g., v1.1.0)'
        required: true
        type: string

# Required for npm Trusted Publishing (OIDC). id-token: write lets the runner
# mint the short-lived OIDC token that npm exchanges for publish access — no
# long-lived NPM_TOKEN secret is used anymore.
permissions:
  contents: read
  id-token: write

jobs:
  publish-single-package:
    name: Publish Single DtoForge Package
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    # Trusted Publishing (OIDC) requires npm >= 11.5.1, newer than the npm
    # bundled with Node. Upgrade before publishing.
    - name: Update npm
      run: npm install -g npm@latest

    - name: Get release version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
        else
          # Get the latest release
          RELEASE_TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          VERSION=${RELEASE_TAG#v}
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION from release: $RELEASE_TAG"

    - name: Download all platform binaries
      run: |
        set -e  # Exit on any error

        mkdir -p npm-package/binaries
        cd npm-package/binaries

        RELEASE_TAG="${{ steps.get_version.outputs.release_tag }}"
        REPO="${{ github.repository }}"

        echo "📦 Downloading binaries from release: $RELEASE_TAG"
        echo "📍 Repository: $REPO"

        # Download all platform binaries
        platforms=(
          "dtoforge-linux-amd64:linux-x64"
          "dtoforge-linux-arm64:linux-arm64"
          "dtoforge-darwin-amd64:darwin-x64"
          "dtoforge-darwin-arm64:darwin-arm64"
          "dtoforge-windows-amd64.exe:win32-x64.exe"
          "dtoforge-windows-arm64.exe:win32-arm64.exe"
        )

        for platform in "${platforms[@]}"; do
          IFS=':' read -r github_name npm_name <<< "$platform"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${github_name}"

          echo "⬇️  Downloading $github_name as $npm_name..."
          echo "   URL: $DOWNLOAD_URL"

          # Use -f to fail on HTTP errors, --retry for transient failures
          if ! curl -fL --retry 3 --retry-delay 5 -o "$npm_name" "$DOWNLOAD_URL"; then
            echo "❌ Failed to download $github_name"
            echo "   Please verify the release $RELEASE_TAG exists and contains this binary"
            exit 1
          fi

          # Verify file was downloaded and has content
          if [ ! -s "$npm_name" ]; then
            echo "❌ Downloaded file $npm_name is empty!"
            exit 1
          fi

          # Make executable if not Windows
          if [[ "$npm_name" != *.exe ]]; then
            chmod +x "$npm_name"
          fi

          echo "✅ Downloaded $npm_name ($(stat -c%s "$npm_name" 2>/dev/null || stat -f%z "$npm_name") bytes)"
        done

        echo ""
        echo "📋 All binaries downloaded:"
        ls -la

    - name: Copy npm files from repo
      run: |
        cd npm-package

        # Copy the install script and bin wrapper
        cp ../scripts/npm/install.js .
        cp ../scripts/npm/bin-wrapper.js .

        # Copy the npm-specific README
        cp ../README.md .

        # Create package.json from template with version substitution
        export VERSION="${{ steps.get_version.outputs.version }}"
        envsubst < ../scripts/npm/package.json.template > package.json

    # Authenticates via OIDC Trusted Publishing — no NODE_AUTH_TOKEN/NPM_TOKEN.
    # --provenance attaches a signed build-provenance attestation (enabled by
    # trusted publishing). The npm package must have a Trusted Publisher
    # configured on npmjs.com pointing at this repo + workflow file.
    - name: Publish to npm
      run: |
        cd npm-package
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ""

    - name: Summary
      run: |
        echo "🎉 Successfully published DtoForge v${{ steps.get_version.outputs.version }} to npm!"
        echo "📦 Package: https://www.npmjs.com/package/dtoforge"
        echo "💾 Install: npm install -g dtoforge"
        echo "🚀 Usage: dtoforge -openapi api.yaml -out ./generated"
